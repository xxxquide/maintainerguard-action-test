name: MaintainerGuard Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: xxxquide/MaintainerGuard@v0.1.1
        with:
          mode: analyze-pr
          dry-run: "true"
          fail-on-risk: none
